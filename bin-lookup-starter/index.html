<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12091e"><link rel="manifest" href="manifest.webmanifest"><title>BIN Lookup</title><style>body{margin:0;background:#12091e;color:#c9cbd2;font:16px system-ui;padding:24px}main{max-width:540px;margin:45px auto}h1{color:#f0f0f2;font-size:32px}.sub{color:#a6a5b2}input{box-sizing:border-box;width:100%;padding:17px;background:#261039;border:1px solid #66318b;border-radius:13px;color:#eee;font-size:22px;letter-spacing:3px}button{width:100%;padding:16px;margin-top:14px;border:0;border-radius:13px;background:#00ad75;color:#071a13;font-weight:800;font-size:17px}.card{margin-top:25px;background:#210d34;border:1px solid #51206f;border-radius:16px;overflow:hidden}.top{padding:19px;border-bottom:1px solid #4c2860;font-size:22px;font-weight:750}.tag{font-size:12px;background:#086c50;padding:6px;border-radius:7px;margin-left:10px}.grid{display:grid;grid-template-columns:1fr 1fr}.cell{padding:18px 14px;border-bottom:1px solid #4c2860;min-width:0;overflow-wrap:anywhere}.cell:nth-child(odd){border-right:1px solid #4c2860}small{display:block;color:#a6a5b2;letter-spacing:1px;font-size:11px;margin-bottom:12px}strong{color:#dbdce0}.error{color:#d53b48;margin-top:15px}.foot{font-size:12px;padding:14px;color:#9a95a6}</style></head><body><main><h1>BIN Lookup</h1><p class="sub">Look up issuer details using the first 6–8 card digits.</p><form id="form"><input id="bin" inputmode="numeric" maxlength="8" placeholder="Enter BIN" autocomplete="off" aria-label="BIN number"><button>Search BIN</button></form><div id="error" class="error" role="alert"></div><section id="result" hidden></section></main><script>const f=document.querySelector("#form"),i=document.querySelector("#bin"),e=document.querySelector("#error"),r=document.querySelector("#result");const esc=s=>String(s??"Unknown").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));f.onsubmit=async ev=>{ev.preventDefault();e.textContent="";r.hidden=true;const bin=i.value.trim();if(!/^\d{6}(\d{2})?$/.test(bin)){e.textContent="Invalid BIN. Enter exactly 6 or 8 digits.";return}const b=f.querySelector("button");b.disabled=true;b.textContent="Searching…";try{const res=await fetch("/api/bin?bin="+encodeURIComponent(bin));const d=await res.json();if(!res.ok)throw Error(d.error||"Lookup failed");const fields=[["ISSUING BANK",d.bank?.name],["CARD TYPE",d.type],["LEVEL",d.brand],["ISSUED IN",d.country?.name],["ISSUER CONTACT",d.bank?.phone],["SCHEME",d.scheme]];r.innerHTML='<div class="card"><div class="top">'+esc(bin)+' <span class="tag">'+esc(d.scheme||"CARD")+'</span></div><div class="grid">'+fields.map(([k,v])=>'<div class="cell"><small>'+k+'</small><strong>'+esc(v)+'</strong></div>').join("")+'</div><div class="foot">BIN data may be incomplete or outdated.</div></div>';r.hidden=false}catch(x){e.textContent=x.message}finally{b.disabled=false;b.textContent="Search BIN"}};</script></body></html>
